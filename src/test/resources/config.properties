# Application
baseUrl=https://team.aldun.com/login
loginPath=/login
# Staff home screen shown after a successful login
dashboardPath=/staff

# Browser: edge | chrome  (override per run: mvn test -Dbrowser=chrome)
browser=edge
headless=false

# Timeouts in seconds
explicitWait=15
pageLoadTimeout=30

# Fixed pause (milliseconds) after typing the email and after typing the password. 0 = off
afterTypingPauseMs=1000
# Slow-motion delay (milliseconds) after opening the page, after every click, and before
# the browser closes, so each step can be watched. 0 = full speed (use 0 on CI)
stepDelayMs=1500
# Pause (milliseconds) on the final screen before the browser closes. 0 = close at once
beforeCloseDelayMs=5000

# Output folders (relative to project root)
screenshotDir=screenshots
reportDir=reports

# Open the summary report in the default browser when the suite finishes (set false on CI)
autoOpenReport=true
# Prefix for test IDs in the summary report (ALD001, ALD002, ...)
testIdPrefix=ALD

# Credentials are NOT stored here.
# Set environment variables ALDUN_EMAIL and ALDUN_PASSWORD before running "auth" tests.
